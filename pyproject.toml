[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "W", "I", "UP"]
lint.ignore = ["E501"]
exclude = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
allow_untyped_defs = true
